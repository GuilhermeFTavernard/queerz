<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Criar quiz — Queerz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Nunito:wght@700;800&family=Outfit:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">
    <header class="navbar">
      <a class="logo" href="meus-quizzes.html" aria-label="Queerz — meus quizzes">Queer<span>z</span></a>
      <nav class="navbar__actions" aria-label="Principal">
        <span class="navbar__user" id="user-name">Olá,</span>
        <a class="btn btn--ghost" href="publicos.html">Quizzes públicos</a>
        <a class="btn btn--ghost" href="meus-quizzes.html">Meus Quizzes</a>
        <button class="btn btn--soft" type="button" id="logout-btn">Sair</button>
      </nav>
    </header>

    <main class="editor">
      <div class="editor__head">
        <a class="btn btn--ghost" href="meus-quizzes.html" id="back-btn">← Voltar</a>
        <h1 class="editor__title" id="page-title">Criar Quiz</h1>
      </div>

      <form class="editor__body" id="quiz-form" novalidate>
        <section class="card card--info">
          <h2 class="card__title">Informações do Quiz</h2>

          <div class="field">
            <label class="field__label" for="quiz-title">Título</label>
            <input class="field__input" id="quiz-title" type="text" placeholder="Ex: Quiz de Geografia" maxlength="120" autocomplete="off" />
          </div>

          <div class="field">
            <label class="field__label" for="quiz-description">Descrição (opcional)</label>
            <input class="field__input" id="quiz-description" type="text" placeholder="Uma breve descrição do quiz..." maxlength="200" autocomplete="off" />
          </div>
        </section>

        <!-- Perguntas (criadas pelo JS) -->
        <div id="questions" class="questions"></div>

        <button class="btn btn--dashed" type="button" id="add-question">+ Adicionar Pergunta</button>

        <p class="alert alert--error" id="form-error" role="alert" hidden></p>

        <div class="editor__footer">
          <a class="btn btn--ghost" href="meus-quizzes.html" id="cancel-btn">Cancelar</a>
          <button class="btn btn--orange btn--wide" type="submit" id="save-btn">Salvar Quiz</button>
        </div>
      </form>
    </main>
  </div>

  <script src="js/mock-api.js"></script>
  <script src="js/quiz-store.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/editor.js"></script>
</body>
</html>
