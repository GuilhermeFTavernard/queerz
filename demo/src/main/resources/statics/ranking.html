<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ranking — Queerz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Outfit:wght@400;500;600;700;900&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/game.css" />
</head>
<body class="game">
  <header class="g-header">
    <a class="g-logo" href="index.html" aria-label="Queerz — página inicial">Queerz</a>
    <div class="g-header__right">
      <a class="g-link" href="publicos.html">← Quizzes públicos</a>
    </div>
  </header>
  <div class="g-progress"><div class="g-progress__bar" style="width: 100%"></div></div>

  <main class="g-main g-main--narrow" id="ranking-main" hidden>
    <div class="final">
      <span class="q-tag">Ranking</span>
      <h1 class="final__name" id="rk-title"></h1>
      <div class="final__hits" id="rk-meta"></div>
    </div>

    <ol class="rank" id="rk-list"></ol>

    <div class="g-actions g-actions--row">
      <a class="g-btn g-btn--ghost" href="publicos.html">Voltar</a>
      <a class="g-btn" id="rk-play" href="quiz.html">Participar do quiz</a>
    </div>
  </main>

  <main class="g-main g-main--narrow" id="rk-notfound" hidden>
    <div class="final">
      <h1 class="final__name">Quiz não encontrado</h1>
      <div class="final__hits">Confira o link ou o código e tente de novo.</div>
    </div>
    <div class="g-actions">
      <a class="g-btn" href="publicos.html">Ver quizzes públicos</a>
    </div>
  </main>

  <script src="js/mock-api.js"></script>
  <script src="js/quiz-store.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ranking.js"></script>
</body>
</html>
